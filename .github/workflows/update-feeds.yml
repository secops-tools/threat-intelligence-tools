name: Update Threat Feeds Status

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check feed availability and latency
        run: python3 scripts/check-feeds.py --timeout 15 --workers 12

      - name: Update README tables and GitHub Pages site
        run: |
          python3 scripts/update-readme.py
          python3 scripts/build-site.py

      - name: Commit updated status if changed
        run: |
          if git diff --quiet data/feed-status.json README.md docs/; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed-status.json README.md docs/
          git commit -m "chore: update daily threat intelligence feed status"
          git push
